[project]
name = "standup"
version = "0.1.0"
description = "Whatever you need to present, as a slide deck."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    # Pinned: 1.14.1 ships no pre-built parsers for windows-x86_64 and fails at parse time.
    # Unpin once a release restores them, or once Windows stops being a target.
    "tree-sitter-language-pack==1.14.0",
    "pillow>=10.0",
    "python-pptx>=1.0",
    "pypdf>=5.1",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
standup = "standup.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
standup = ["web/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
